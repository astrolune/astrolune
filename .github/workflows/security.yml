name: Dependency security

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check

  license-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.18.6 --locked
      - name: Coverage and SPDX regression tests
        run: >-
          python -B -m unittest discover -s .github/scripts
          -p 'test_check_license_coverage.py' -v
      - name: Record the crate graph cargo-deny actually evaluates
        run: |
          mkdir -p target
          cargo deny --locked list --format tsv > target/deny-graph.tsv
      - name: Licence-check every locked package and hold the coverage bound
        run: >-
          python -B .github/scripts/check-license-coverage.py
          --deny-list target/deny-graph.tsv
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-license-coverage
          path: |
            target/dependency-license-coverage.json
            target/deny-graph.tsv

  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install cargo-audit
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install cargo-audit --version 0.22.2 --locked
      - name: Audit dependencies
        run: cargo +stable audit
      - name: Audit the workspace-excluded fuzz lockfile
        run: cargo +stable audit --file crates/codec/fuzz/Cargo.lock

  registry-advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
      - name: Bounded lookup regression tests
        run: python -B -m unittest discover -s .github/scripts -p 'test_audit_dependencies.py' -v
      - name: Verify the pinned snapshot still covers both lockfiles
        run: python -B .github/scripts/audit-dependencies.py --offline
      - name: Query OSV for every locked registry package
        run: python -B .github/scripts/audit-dependencies.py --timeout 30 --max-requests 16
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-advisories
          path: target/dependency-advisories.json
