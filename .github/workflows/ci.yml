name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  tests:
    name: Tests (${{ matrix.os }}, ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        profile: [dev, release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.profile }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
      - name: Unit, integration, and documentation tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/suite
          cargo test --locked --workspace --all-features --profile ${{ matrix.profile }} 2>&1 \
            | tee target/suite/tests.log
      - name: Pinned Rust wasm32 builds and SDK integration
        if: matrix.profile == 'release'
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p cargo-contract --release -- --ignored 2>&1 \
            | tee -a target/suite/tests.log
      - name: Record the per-platform suite result
        if: ${{ always() }}
        run: >-
          python -B .github/scripts/suite-report.py
          --log target/suite/tests.log
          --os ${{ matrix.os }}
          --profile ${{ matrix.profile }}
          --exit-status ${{ job.status == 'success' && '0' || '101' }}
          --output target/suite/SUITE.json
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: suite-${{ matrix.os }}-${{ matrix.profile }}
          path: target/suite/SUITE.json
          if-no-files-found: error
          retention-days: 90

  suites:
    name: Four-leg suite qualification
    if: ${{ always() }}
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
      - uses: actions/download-artifact@v7
        with:
          pattern: suite-*
          path: target/suite-legs
      # A leg that produced no result fails here rather than passing quietly:
      # the four uploaded records are the only evidence the suite ran on every
      # platform and profile, and three clean records look exactly like four to
      # anything that merely reads the files it was handed.
      - name: Require four clean legs that agree on one compiler
        run: >-
          python -B .github/scripts/compare-suites.py
          --artifact-root target/suite-legs
          --output target/suite-legs/SUITE-QUALIFICATION.json
      # Retained on refusal too: the verdict names which leg was absent or
      # unclean, which the job log alone does not keep for 90 days.
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: suite-qualification
          path: target/suite-legs/SUITE-QUALIFICATION.json
          if-no-files-found: ignore
          retention-days: 90

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo doc --locked --workspace --all-features --no-deps

  build:
    name: Release build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
      - name: Independently rebuild and compare release binaries
        run: python -B .github/scripts/verify-native-build.py ${{ matrix.target }} --binaries-output target/${{ matrix.target }}/release
      - name: Smoke-test release binaries and daemon recovery
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          bin="target/$BUILD_TARGET/release"
          "$bin/cli" --help
          "$bin/cargo-contract" --help
          "$bin/daemon" --help
          "$bin/daemon" --dry-run
          data_dir="$RUNNER_TEMP/astrolune-smoke"
          "$bin/daemon" --data-dir "$data_dir" --blocks 3 --p2p-listen 127.0.0.1:0 --rpc-listen 127.0.0.2:0
          "$bin/daemon" --data-dir "$data_dir" --blocks 2 --p2p-listen 127.0.0.1:0 --rpc-listen 127.0.0.2:0
          "$bin/daemon" --data-dir "$data_dir" --blocks 0
      - name: Archive reproducibility and independent protocol fixtures
        run: python -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Package binaries with checksums and build metadata
        run: python .github/scripts/package-build.py ${{ matrix.target }}
      - name: Compose the platform qualification report
        env:
          ASTROLUNE_MACHINE: ${{ runner.name }}#${{ github.run_id }}.${{ github.run_attempt }}
        run: >-
          python -B .github/scripts/qualification-report.py
          --output target/ci-artifacts/QUALIFICATION.json
      - uses: actions/upload-artifact@v7
        with:
          name: astrolune-${{ matrix.target }}
          path: target/ci-artifacts/*
          if-no-files-found: error
          retention-days: 14
      # Kept far longer than the archive: comparing two machines means holding
      # one run's evidence until a second machine produces its own.
      - uses: actions/upload-artifact@v7
        with:
          name: qualification-${{ matrix.target }}
          path: target/ci-artifacts/QUALIFICATION.json
          if-no-files-found: error
          retention-days: 90

  reproducibility:
    name: Independent-run reproducibility (${{ matrix.target }})
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-pc-windows-msvc]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
      - uses: actions/download-artifact@v7
        with:
          name: qualification-${{ matrix.target }}
          path: target/qualification/this-run
      # `ASTROLUNE_MACHINE` embeds the run id, so two runs are always distinct
      # machines to the comparator. Two hosted runners of one image are two
      # machines only in that sense; `docs/39` records what that does not
      # establish. An absent second run is reported and establishes nothing: it
      # is never reported as agreement.
      - name: Compare this run against another run of the same revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Pull-request runs are excluded on purpose: there `GITHUB_SHA` is a
          # merge commit that moves with the base branch, so their packaged
          # revision is not this revision and comparing them would manufacture
          # a disagreement out of two correct builds.
          runs="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=100" \
            --jq '.workflow_runs[] | select(.event != "pull_request") | .id')"
          other="$(printf '%s\n' "$runs" | grep -vx "${GITHUB_RUN_ID}" | head -n 1 || true)"
          if [ -z "$other" ]; then
            echo "No other successful CI run of ${GITHUB_SHA} exists, so this run" \
              "establishes nothing about independent-machine reproducibility."
            exit 0
          fi
          if ! gh run download "$other" --name "qualification-${TARGET}" \
            --dir target/qualification/other-run; then
            echo "Run ${other} retains no qualification-${TARGET} artifact, so no" \
              "second machine's evidence is available to compare."
            exit 0
          fi
          mine="$(jq -r .revision target/qualification/this-run/QUALIFICATION.json)"
          theirs="$(jq -r .revision target/qualification/other-run/QUALIFICATION.json)"
          if [ "$mine" != "$theirs" ]; then
            echo "Run ${other} packaged revision ${theirs}, not ${mine}, so it is" \
              "not evidence about this revision."
            exit 0
          fi
          python -B .github/scripts/compare-qualification.py \
            target/qualification/this-run/QUALIFICATION.json \
            target/qualification/other-run/QUALIFICATION.json \
            --output "target/qualification/REPRODUCIBILITY-${TARGET}.json"
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: reproducibility-${{ matrix.target }}
          path: target/qualification/REPRODUCIBILITY-*.json
          if-no-files-found: ignore
          retention-days: 90

  fuzz:
    name: Fuzz target compilation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: crates/codec/fuzz
      - name: Compile-check the workspace-excluded fuzz package
        run: cargo check --locked --manifest-path crates/codec/fuzz/Cargo.toml --all-targets

  benchmarks:
    name: Benchmarks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      # A shared runner cannot establish a comparable figure, so sampling stays
      # short. This job proves every benchmark still executes and retains what
      # it measured; it is not a performance gate and has no timing threshold.
      ASTROLUNE_BENCH_ROUNDS: "3"
      ASTROLUNE_BENCH_TARGET_US: "300"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: bench
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
      - name: Run every benchmark suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/bench
          cargo bench --locked --workspace --all-features 2>&1 \
            | tee target/bench/benchmarks.log
      - name: Record the per-platform benchmark report
        if: ${{ always() }}
        run: >-
          python -B .github/scripts/benchmark-report.py
          --log target/bench/benchmarks.log
          --os ${{ matrix.os }}
          --exit-status ${{ job.status == 'success' && '0' || '101' }}
          --output target/bench/BENCHMARKS.json
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: benchmarks-${{ matrix.os }}
          path: target/bench/BENCHMARKS.json
          if-no-files-found: error
          retention-days: 90

  workflows:
    name: Workflow validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: false
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: actionlint -color

  quality:
    name: CI required checks
    if: ${{ always() }}
    needs:
      [
        formatting,
        clippy,
        tests,
        suites,
        docs,
        build,
        reproducibility,
        fuzz,
        benchmarks,
        workflows,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all CI jobs to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -e 'all(.[]; .result == "success")'
