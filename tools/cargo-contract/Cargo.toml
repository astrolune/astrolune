[package]
name = "cargo-contract"
description = "Cargo subcommand for AstroLune Rust contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
codec = { version = "0.1.0", path = "../../crates/codec" }
proc-macro2 = "=1.0.107"
toml = { version = "=1.1.6", default-features = false, features = ["std", "parse", "serde"] }
runtime = { version = "0.1.0", path = "../../crates/runtime" }
types = { version = "0.1.0", path = "../../crates/types" }

[dev-dependencies]
contract-sdk = { version = "0.1.0", path = "../../crates/contract-sdk", default-features = false }
wat = "=1.261.0"

[lints]
workspace = true
