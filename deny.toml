[graph]
# An empty target list is the widest setting cargo-deny offers: no cfg filtering
# is applied, so Windows, wasi, UEFI and unix crates are all evaluated. Naming
# explicit triples measurably narrows the graph (121 crates here, 100 for
# x86_64-pc-windows-msvc alone on 2026-10-08), so it is deliberately left empty.
targets = []
all-features = true
# cargo-deny resolves only what cargo would compile, and prunes every
# dev-dependency edge regardless of `exclude-dev`. Its graph is therefore 121 of
# the 158 packages in Cargo.lock. The omitted 37 are enumerated, licence-checked
# and bounded by .github/scripts/check-license-coverage.py against
# .github/scripts/deny-coverage-baseline.json; see
# docs/51-dependency-and-security-review.md.

[advisories]
version = 2
yanked = "deny"
# Pin the broadest unmaintained reporting instead of inheriting a default that
# may narrow. Config version 2 removed the `unsound` and `notice` keys; both
# classes are unconditional errors and cannot be configured here.
unmaintained = "all"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
# Deny new duplicates and name the two that upstream crates force today. Two
# further lockfile duplicates, hashbrown and wasmparser, sit outside this graph
# and are bounded by the coverage baseline instead; adding them here would only
# raise `unmatched skip` warnings.
multiple-versions = "deny"
wildcards = "deny"
skip = [
    # ring 0.17.14 still requires getrandom 0.2; first-party code uses 0.4.3.
    { crate = "getrandom@0.2.17", reason = "transitive requirement of ring" },
    # curve25519-dalek-derive and zeroize_derive still build against syn 2.
    { crate = "syn@2.0.119", reason = "transitive requirement of dalek/zeroize macros" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
