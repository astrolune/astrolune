[package]
name = "integration"
description = "Workspace-level conformance tests for AstroLune"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
codec = { version = "0.1.0", path = "../../crates/codec" }
config = { version = "0.1.0", path = "../../crates/config" }
consensus = { version = "0.1.0", path = "../../crates/consensus" }
crypto = { version = "0.1.0", path = "../../crates/crypto" }
dns = { version = "0.1.0", path = "../../services/dns" }
execution = { version = "0.1.0", path = "../../crates/execution" }
genesis = { version = "0.1.0", path = "../../crates/genesis" }
keystore = { version = "0.1.0", path = "../../crates/keystore" }
mempool = { version = "0.1.0", path = "../../crates/mempool" }
node = { version = "0.1.0", path = "../../crates/node" }
p2p = { version = "0.1.0", path = "../../crates/p2p" }
rpc = { version = "0.1.0", path = "../../crates/rpc" }
state = { version = "0.1.0", path = "../../crates/state" }
storage = { version = "0.1.0", path = "../../crates/storage" }
sync = { version = "0.1.0", path = "../../crates/sync" }
telemetry = { version = "0.1.0", path = "../../crates/telemetry" }
testkit = { version = "0.1.0", path = "../../crates/testkit" }
transaction = { version = "0.1.0", path = "../../crates/transaction" }
types = { version = "0.1.0", path = "../../crates/types" }

[lints]
workspace = true

[dev-dependencies]
contract-sdk = { version = "0.1.0", path = "../../crates/contract-sdk", default-features = false }
runtime = { version = "0.1.0", path = "../../crates/runtime" }
wat = "=1.261.0"